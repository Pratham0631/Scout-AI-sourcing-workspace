[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/report.html --self-contained-html
markers =
    smoke: Critical path smoke tests for quick verification
    regression: Comprehensive regression test suite
    api: Backend REST API tests using Requests
    ui: Browser-based UI automation using Playwright
    selenium: Browser-based UI automation demonstration using Selenium WebDriver
    e2e: End-to-end tests validating full multi-step workflows
    auth: Authentication and authorization contract tests
