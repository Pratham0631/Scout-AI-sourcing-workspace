version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile.app
    ports:
      - "8080:8080"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-test-key}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  qa-tests:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    environment:
      - BASE_URL=http://app:8080
      - HEADLESS=true
    volumes:
      - ./reports:/app/qa-automation/reports
